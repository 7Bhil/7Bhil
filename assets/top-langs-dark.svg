<svg
  width="300"
  height="215"
  viewBox="0 0 300 215"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="descId"
>
  <title id="titleId">Most Used Languages</title>
  <desc id="descId">Most used languages by Bhilal. Chitou</desc>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #58a6ff;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    .lang-name {
      font: 400 11px "Segoe UI", Ubuntu, Sans-Serif;
      fill: #c9d1d9;
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    #rect-mask rect {
      animation: slideInAnimation 1s ease-in-out forwards;
    }
    @keyframes slideInAnimation {
      from { width: 0; }
      to { width: 100%; }
    }
    @keyframes fadeInAnimation {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>

  <rect
    data-testid="card-bg"
    x="0.5"
    y="0.5"
    rx="6"
    height="99%"
    stroke="#30363d"
    width="299"
    fill="#0d1117"
    stroke-opacity="1"
  />

  <g data-testid="card-title" transform="translate(25, 35)">
    <text x="0" y="0" class="header" data-testid="header">Most Used Languages</text>
  </g>

  <g data-testid="main-card-body" transform="translate(0, 55)">
    <svg data-testid="lang-items" x="25">
      <mask id="rect-mask">
        <rect x="0" y="0" width="250" height="8" fill="white" rx="5"/>
      </mask>
      
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="0.00" y="0" width="199.77" height="8" fill="#3572A5" />
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="199.77" y="0" width="30.40" height="8" fill="#f34b7d" />
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="230.17" y="0" width="4.70" height="8" fill="#f1e05a" />
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="234.87" y="0" width="2.95" height="8" fill="#e34c26" />
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="237.82" y="0" width="2.82" height="8" fill="#555555" />
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="240.65" y="0" width="2.13" height="8" fill="#fedf5b" />
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="242.77" y="0" width="1.68" height="8" fill="#3178c6" />
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="244.45" y="0" width="1.63" height="8" fill="#41b883" />
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="246.07" y="0" width="1.50" height="8" fill="#563d7c" />
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="247.57" y="0" width="1.50" height="8" fill="#3A4E58" />
      
      <g transform="translate(0, 25)">
        <g transform="translate(0, 0)">
          <g transform="translate(0, 0)">
    <g class="stagger" style="animation-delay: 450ms">
      <circle cx="5" cy="6" r="5" fill="#3572A5" />
      <text data-testid="lang-name" x="15" y="10" class="lang-name">
        Python 79.91%
      </text>
    </g>
  </g><g transform="translate(0, 25)">
    <g class="stagger" style="animation-delay: 600ms">
      <circle cx="5" cy="6" r="5" fill="#f34b7d" />
      <text data-testid="lang-name" x="15" y="10" class="lang-name">
        C++ 12.16%
      </text>
    </g>
  </g><g transform="translate(0, 50)">
    <g class="stagger" style="animation-delay: 750ms">
      <circle cx="5" cy="6" r="5" fill="#f1e05a" />
      <text data-testid="lang-name" x="15" y="10" class="lang-name">
        JavaScript 1.88%
      </text>
    </g>
  </g><g transform="translate(0, 75)">
    <g class="stagger" style="animation-delay: 900ms">
      <circle cx="5" cy="6" r="5" fill="#e34c26" />
      <text data-testid="lang-name" x="15" y="10" class="lang-name">
        HTML 1.18%
      </text>
    </g>
  </g><g transform="translate(0, 100)">
    <g class="stagger" style="animation-delay: 1050ms">
      <circle cx="5" cy="6" r="5" fill="#555555" />
      <text data-testid="lang-name" x="15" y="10" class="lang-name">
        C 1.13%
      </text>
    </g>
  </g>
        </g>
        <g transform="translate(140, 0)">
          <g transform="translate(0, 0)">
    <g class="stagger" style="animation-delay: 450ms">
      <circle cx="5" cy="6" r="5" fill="#fedf5b" />
      <text data-testid="lang-name" x="15" y="10" class="lang-name">
        Cython 0.85%
      </text>
    </g>
  </g><g transform="translate(0, 25)">
    <g class="stagger" style="animation-delay: 600ms">
      <circle cx="5" cy="6" r="5" fill="#3178c6" />
      <text data-testid="lang-name" x="15" y="10" class="lang-name">
        TypeScript 0.67%
      </text>
    </g>
  </g><g transform="translate(0, 50)">
    <g class="stagger" style="animation-delay: 750ms">
      <circle cx="5" cy="6" r="5" fill="#41b883" />
      <text data-testid="lang-name" x="15" y="10" class="lang-name">
        Vue 0.65%
      </text>
    </g>
  </g><g transform="translate(0, 75)">
    <g class="stagger" style="animation-delay: 900ms">
      <circle cx="5" cy="6" r="5" fill="#563d7c" />
      <text data-testid="lang-name" x="15" y="10" class="lang-name">
        CSS 0.33%
      </text>
    </g>
  </g><g transform="translate(0, 100)">
    <g class="stagger" style="animation-delay: 1050ms">
      <circle cx="5" cy="6" r="5" fill="#3A4E58" />
      <text data-testid="lang-name" x="15" y="10" class="lang-name">
        Cuda 0.24%
      </text>
    </g>
  </g>
        </g>
      </g>
    </svg>
  </g>
</svg>