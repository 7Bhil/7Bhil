    <rect width="1120" height="195" rx="20" fill="url(#cardBg)" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1"/>
    <text x="28" y="36" font-size="17" font-weight="700" fill="#E8ECF8">24-Hour Commit &amp; Coding Activity Rhythm</text>
    <text x="1092" y="36" text-anchor="end" font-size="13" fill="#8B94B3">UTC+1 (West Africa Time)</text>
    
    
      <rect class="b" x="48" y="129" width="26" height="16" rx="4" fill="url(#bar)" />
      <text x="61" y="165" text-anchor="middle" font-size="11" fill="#8B94B3">0h</text>
    

      <rect class="b" x="92" y="134" width="26" height="11" rx="4" fill="url(#bar)" />
      <text x="105" y="165" text-anchor="middle" font-size="11" fill="#8B94B3">1h</text>
    

      <rect class="b" x="136" y="137" width="26" height="8" rx="4" fill="url(#bar)" />
      <text x="149" y="165" text-anchor="middle" font-size="11" fill="#8B94B3">2h</text>
    

      <rect class="b" x="180" y="137" width="26" height="8" rx="4" fill="url(#bar)" />
      <text x="193" y="165" text-anchor="middle" font-size="11" fill="#8B94B3">3h</text>
    

      <rect class="b" x="224" y="137" width="26" height="8" rx="4" fill="url(#bar)" />
