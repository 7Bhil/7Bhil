      <rect class="b" x="312" y="124" width="26" height="21" rx="4" fill="url(#bar)" />
      <text x="325" y="165" text-anchor="middle" font-size="11" fill="#8B94B3">6h</text>
    

      <rect class="b" x="356" y="105" width="26" height="40" rx="4" fill="url(#bar)" />
      <text x="369" y="165" text-anchor="middle" font-size="11" fill="#8B94B3">7h</text>
    

      <rect class="b" x="400" y="84" width="26" height="61" rx="4" fill="url(#bar)" />
      <text x="413" y="165" text-anchor="middle" font-size="11" fill="#8B94B3">8h</text>
    

      <rect class="b" x="444" y="69" width="26" height="76" rx="4" fill="url(#bar)" />
      <text x="457" y="165" text-anchor="middle" font-size="11" fill="#8B94B3">9h</text>
    

      <rect class="b" x="488" y="63" width="26" height="82" rx="4" fill="url(#bar)" />
      <text x="501" y="165" text-anchor="middle" font-size="11" fill="#8B94B3">10h</text>
    

      <rect class="b" x="532" y="47" width="26" height="98" rx="4" fill="url(#barPeak)" />
      <text x="545" y="165" text-anchor="middle" font-size="11" fill="#8B94B3">11h</text>
    

      <rect class="b" x="576" y="60" width="26" height="85" rx="4" fill="url(#bar)" />
      <text x="589" y="165" text-anchor="middle" font-size="11" fill="#8B94B3">12h</text>
    

      <rect class="b" x="620" y="67" width="26" height="78" rx="4" fill="url(#bar)" />
      <text x="633" y="165" text-anchor="middle" font-size="11" fill="#8B94B3">13h</text>
    

      <rect class="b" x="664" y="52" width="26" height="93" rx="4" fill="url(#barPeak)" />
      <text x="677" y="165" text-anchor="middle" font-size="11" fill="#8B94B3">14h</text>
    

      <rect class="b" x="708" y="40" width="26" height="105" rx="4" fill="url(#barPeak)" />
      <text x="721" y="165" text-anchor="middle" font-size="11" fill="#8B94B3">15h</text>
    

      <rect class="b" x="752" y="65" width="26" height="80" rx="4" fill="url(#bar)" />
      <text x="765" y="165" text-anchor="middle" font-size="11" fill="#8B94B3">16h</text>
    

      <rect class="b" x="796" y="78" width="26" height="67" rx="4" fill="url(#bar)" />
      <text x="809" y="165" text-anchor="middle" font-size="11" fill="#8B94B3">17h</text>
    

      <rect class="b" x="840" y="90" width="26" height="55" rx="4" fill="url(#bar)" />
      <text x="853" y="165" text-anchor="middle" font-size="11" fill="#8B94B3">18h</text>
    

      <rect class="b" x="884" y="101" width="26" height="44" rx="4" fill="url(#bar)" />
      <text x="897" y="165" text-anchor="middle" font-size="11" fill="#8B94B3">19h</text>
    

      <rect class="b" x="928" y="108" width="26" height="37" rx="4" fill="url(#bar)" />
      <text x="941" y="165" text-anchor="middle" font-size="11" fill="#8B94B3">20h</text>
    

      <rect class="b" x="972" y="114" width="26" height="31" rx="4" fill="url(#bar)" />
      <text x="985" y="165" text-anchor="middle" font-size="11" fill="#8B94B3">21h</text>
    

      <rect class="b" x="1016" y="120" width="26" height="25" rx="4" fill="url(#bar)" />
      <text x="1029" y="165" text-anchor="middle" font-size="11" fill="#8B94B3">22h</text>
    

      <rect class="b" x="1060" y="125" width="26" height="20" rx="4" fill="url(#bar)" />
      <text x="1073" y="165" text-anchor="middle" font-size="11" fill="#8B94B3">23h</text>
    
  </g>

  <!-- ==================== ROW 3: TOP LANGUAGES ==================== -->
  <g transform="translate(40, 528)">
    <!-- CARD 4: DOUGHNUT CHART -->
    <rect width="550" height="235" rx="20" fill="url(#cardBg)" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1"/>
    <text x="28" y="36" font-size="17" font-weight="700" fill="#E8ECF8">Dominant Tech Stack</text>

    <!-- Doughnut Background Ring -->
    <circle cx="450" cy="115" r="68" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="26"/>
    
    <!-- Doughnut Slices -->
    <circle cx="450" cy="115" r="68" fill="none" stroke="#f1e05a" stroke-width="26" stroke-dasharray="163.56 427.26" stroke-dashoffset="0.00" transform="rotate(-90 450 115)" style="opacity: 0.95; transition: all 0.5s ease;"/>
<circle cx="450" cy="115" r="68" fill="none" stroke="#e34c26" stroke-width="26" stroke-dasharray="69.09 427.26" stroke-dashoffset="-163.56" transform="rotate(-90 450 115)" style="opacity: 0.95; transition: all 0.5s ease;"/>
<circle cx="450" cy="115" r="68" fill="none" stroke="#3178c6" stroke-width="26" stroke-dasharray="47.13 427.26" stroke-dashoffset="-232.64" transform="rotate(-90 450 115)" style="opacity: 0.95; transition: all 0.5s ease;"/>
<circle cx="450" cy="115" r="68" fill="none" stroke="#41b883" stroke-width="26" stroke-dasharray="45.50 427.26" stroke-dashoffset="-279.77" transform="rotate(-90 450 115)" style="opacity: 0.95; transition: all 0.5s ease;"/>
<circle cx="450" cy="115" r="68" fill="none" stroke="#3572A5" stroke-width="26" stroke-dasharray="35.38 427.26" stroke-dashoffset="-325.27" transform="rotate(-90 450 115)" style="opacity: 0.95; transition: all 0.5s ease;"/>

    <!-- Center text in Doughnut -->
