    <text x="450" y="132" text-anchor="middle" font-size="12" fill="#8B94B3">JavaScript</text>

    <text x="28" y="80" font-size="14" fill="#8B94B3">Primary specialization based</text>
    <text x="28" y="100" font-size="14" fill="#8B94B3">on byte analysis across 100+ repositories.</text>

    <g transform="translate(28, 140)">
      <rect width="180" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.04" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <circle cx="16" cy="14" r="4" fill="#f1e05a"/>
      <text x="28" y="19" font-size="12" font-weight="600" fill="#E8ECF8">Top: JavaScript</text>
    </g>

    <!-- CARD 5: LANGUAGES LIST -->
    <rect x="570" y="0" width="550" height="235" rx="20" fill="url(#cardBg)" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1"/>
    <text x="598" y="36" font-size="17" font-weight="700" fill="#E8ECF8">Language Distribution Breakdown</text>

    
      <circle cx="620" cy="80" r="5" fill="#f1e05a"/>
      <text x="638" y="85" font-size="14" fill="#E8ECF8">JavaScript</text>
      <text x="1080" y="85" text-anchor="end" font-size="14" font-weight="600" fill="#8B94B3">38.28%</text>
    

      <circle cx="620" cy="108" r="5" fill="#e34c26"/>
      <text x="638" y="113" font-size="14" fill="#E8ECF8">HTML</text>
      <text x="1080" y="113" text-anchor="end" font-size="14" font-weight="600" fill="#8B94B3">16.17%</text>
    

      <circle cx="620" cy="136" r="5" fill="#3178c6"/>
