<svg
  width="300"
  height="215"
  viewBox="0 0 300 215"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-labelledby="descId"
>
  <title id="titleId">Most Used Languages</title>
  <desc id="descId">Most used languages by Bhilal. Chitou</desc>
  <style>
    .header {
      font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
      fill: #0969da;
      animation: fadeInAnimation 0.8s ease-in-out forwards;
    }
    .lang-name {
      font: 400 11px "Segoe UI", Ubuntu, Sans-Serif;
      fill: #24292f;
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    #rect-mask rect {
      animation: slideInAnimation 1s ease-in-out forwards;
    }
    @keyframes slideInAnimation {
      from { width: 0; }
      to { width: 100%; }
    }
    @keyframes fadeInAnimation {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>

  <rect
    data-testid="card-bg"
    x="0.5"
    y="0.5"
    rx="6"
    height="99%"
    stroke="#e1e4e8"
    width="299"
    fill="#fffefe"
    stroke-opacity="1"
  />

  <g data-testid="card-title" transform="translate(25, 35)">
    <text x="0" y="0" class="header" data-testid="header">Most Used Languages</text>
  </g>

  <g data-testid="main-card-body" transform="translate(0, 55)">
    <svg data-testid="lang-items" x="25">
      <mask id="rect-mask">
        <rect x="0" y="0" width="250" height="8" fill="white" rx="5"/>
      </mask>
      
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="0.00" y="0" width="84.08" height="8" fill="#f1e05a" />
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="84.08" y="0" width="44.55" height="8" fill="#e34c26" />
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="128.63" y="0" width="28.55" height="8" fill="#3178c6" />
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="157.18" y="0" width="27.98" height="8" fill="#41b883" />
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="185.15" y="0" width="20.67" height="8" fill="#3572A5" />
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="205.82" y="0" width="12.15" height="8" fill="#4F5D95" />
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="217.97" y="0" width="10.63" height="8" fill="#563d7c" />
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="228.60" y="0" width="7.92" height="8" fill="#00B4AB" />
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="236.53" y="0" width="5.70" height="8" fill="#f7523f" />
        <rect mask="url(#rect-mask)" data-testid="lang-progress" x="242.22" y="0" width="2.52" height="8" fill="#f34b7d" />
      
      <g transform="translate(0, 25)">
        <g transform="translate(0, 0)">
          <g transform="translate(0, 0)">
    <g class="stagger" style="animation-delay: 450ms">
      <circle cx="5" cy="6" r="5" fill="#f1e05a" />
      <text data-testid="lang-name" x="15" y="10" class="lang-name">
        JavaScript 33.63%
      </text>
    </g>
  </g><g transform="translate(0, 25)">
    <g class="stagger" style="animation-delay: 600ms">
      <circle cx="5" cy="6" r="5" fill="#e34c26" />
      <text data-testid="lang-name" x="15" y="10" class="lang-name">
        HTML 17.82%
      </text>
    </g>
  </g><g transform="translate(0, 50)">
    <g class="stagger" style="animation-delay: 750ms">
      <circle cx="5" cy="6" r="5" fill="#3178c6" />
      <text data-testid="lang-name" x="15" y="10" class="lang-name">
        TypeScript 11.42%
      </text>
    </g>
  </g><g transform="translate(0, 75)">
    <g class="stagger" style="animation-delay: 900ms">
      <circle cx="5" cy="6" r="5" fill="#41b883" />
      <text data-testid="lang-name" x="15" y="10" class="lang-name">
        Vue 11.19%
      </text>
    </g>
  </g><g transform="translate(0, 100)">
    <g class="stagger" style="animation-delay: 1050ms">
      <circle cx="5" cy="6" r="5" fill="#3572A5" />
      <text data-testid="lang-name" x="15" y="10" class="lang-name">
        Python 8.27%
      </text>
    </g>
  </g>
        </g>
        <g transform="translate(140, 0)">
          <g transform="translate(0, 0)">
    <g class="stagger" style="animation-delay: 450ms">
      <circle cx="5" cy="6" r="5" fill="#4F5D95" />
      <text data-testid="lang-name" x="15" y="10" class="lang-name">
        PHP 4.86%
      </text>
    </g>
  </g><g transform="translate(0, 25)">
    <g class="stagger" style="animation-delay: 600ms">
      <circle cx="5" cy="6" r="5" fill="#563d7c" />
      <text data-testid="lang-name" x="15" y="10" class="lang-name">
        CSS 4.25%
      </text>
    </g>
  </g><g transform="translate(0, 50)">
    <g class="stagger" style="animation-delay: 750ms">
      <circle cx="5" cy="6" r="5" fill="#00B4AB" />
      <text data-testid="lang-name" x="15" y="10" class="lang-name">
        Dart 3.17%
      </text>
    </g>
  </g><g transform="translate(0, 75)">
    <g class="stagger" style="animation-delay: 900ms">
      <circle cx="5" cy="6" r="5" fill="#f7523f" />
      <text data-testid="lang-name" x="15" y="10" class="lang-name">
        Blade 2.28%
      </text>
    </g>
  </g><g transform="translate(0, 100)">
    <g class="stagger" style="animation-delay: 1050ms">
      <circle cx="5" cy="6" r="5" fill="#f34b7d" />
      <text data-testid="lang-name" x="15" y="10" class="lang-name">
        C++ 1.01%
      </text>
    </g>
  </g>
        </g>
      </g>
    </svg>
  </g>
</svg>