name: Update GitHub Profile Stats SVGs

on:
  schedule:
    - cron: '0 */6 * * *' # Runs automatically every 6 hours
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  update-stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Generate SVG Stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate_svgs.js

      - name: Commit and Push Updated SVGs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          if git diff --staged --quiet; then
            echo "No changes in SVG stats."
          else
            git commit -m "chore: auto-update SVG stats cards [skip ci]"
            git push
          fi
